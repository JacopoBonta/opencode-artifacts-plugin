name: Publish

# Publishes to npm when a GitHub Release is published. The release tag should
# match the package.json version (e.g. v0.2.0). Requires an NPM_TOKEN secret
# (an npm automation token with publish access).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test (backend)
        run: bun run test

      # `prepublishOnly` builds companion/dist (via bun) before the tarball is
      # created; npm provenance attests the build to the public registry.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
